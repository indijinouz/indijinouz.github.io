name: Build BMI HTML Tables

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'bmi-royalty-statements/**'
      - 'bmi-works-catalog/**'
      - 'scripts/convert_royalties.py'
      - 'scripts/convert_works.py'
      - 'scripts/build_royalties.py'
      - 'scripts/build_works.py'
      - 'scripts/build_sitemap.py'
      - '.github/workflows/build-tables.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Convert royalty CSVs to HTML
        run: python3 scripts/convert_royalties.py

      - name: Convert Works Catalog CSV to HTML
        run: python3 scripts/convert_works.py

      - name: Build BMI Royalty Records
        run: python3 scripts/build_royalties.py

      - name: Build BMI Works Catalog
        run: python3 scripts/build_works.py

      - name: Build sitemap
        run: python3 scripts/build_sitemap.py

      - name: Save generated HTML pages, data, and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bmi-royalty-statements/
          git add bmi-works-catalog/
          git add bmi-royalty-records.html
          git add -A bmi-royalty-records-data/
          git add bmi-works-catalog.html
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Update BMI HTML tables, data, and sitemap"
            git push
          fi
